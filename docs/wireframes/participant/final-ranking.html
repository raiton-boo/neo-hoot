<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neo-hoot | 最終順位</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <div class="mobile-screen">
      <h1 style="text-align: center">最終結果</h1>

      <div
        class="card"
        style="text-align: center; background: var(--color-primary)"
      >
        <p class="lede" style="margin-bottom: 0.25rem; color: #0a0a0a">
          あなたの順位
        </p>
        <h1 style="font-size: 3rem">3位</h1>
        <p style="margin: 0">合計 2,340pt</p>
      </div>

      <h2>トップ3</h2>
      <div class="row" style="flex-direction: column; align-items: stretch">
        <div class="list-item">
          <span class="rank">1</span>
          <span class="name">はなこ</span>
          <span class="badge">2980pt</span>
        </div>
        <div class="list-item">
          <span class="rank">2</span>
          <span class="name">じろう</span>
          <span class="badge">2650pt</span>
        </div>
        <div class="list-item">
          <span class="rank">3</span>
          <span class="name">たろう(自分)</span>
          <span class="badge">2340pt</span>
        </div>
      </div>

      <button class="btn btn-block" style="margin-top: 1.5rem">
        トップ画面に戻る
      </button>
    </div>
  </body>
</html>
