<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>neo-hoot | 出題進行(ホスト)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../shared.css" />
<style>
  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .q-header .timer {
    width: 5rem;
    height: 5rem;
    font-size: 2.5rem;
  }
  .q-body {
    text-align: center;
    font-size: 2rem;
    font-family: 'Paytone One', system-ui, sans-serif;
    margin: 2rem 0;
  }
  .q-choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 700px;
    margin: 0 auto;
  }
  .q-choice {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.5rem;
    border: var(--border-width) solid var(--color-ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--color-ink);
    color: #fff;
    font-family: 'Paytone One', system-ui, sans-serif;
    font-size: 1.25rem;
  }
  .q-choice.a { background: var(--color-secondary); }
  .q-choice.b { background: var(--color-accent); }
  .q-choice.c { background: #ffb800; }
  .q-choice.d { background: var(--color-success); }
</style>
</head>
<body>

<div class="q-header">
  <span class="badge">第2問 / 全5問</span>
  <div class="timer">08</div>
  <span class="badge">回答済み: 8 / 12人</span>
</div>

<p class="q-body">日本で一番面積が大きい都道府県は？</p>

<div class="q-choice-grid">
  <div class="q-choice a">▲ 北海道</div>
  <div class="q-choice b">◆ 岩手県</div>
  <div class="q-choice c">● 福島県</div>
  <div class="q-choice d">■ 長野県</div>
</div>

</body>
</html>
