<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neo-hoot | 回答画面</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .answer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .choice-grid {
        flex: 1;
      }
      .choice-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="mobile-screen">
      <div class="answer-header">
        <span class="badge">第2問 / 全5問</span>
        <div class="timer">08</div>
      </div>

      <p class="lede" style="text-align: center; font-size: 0.9rem">
        画面には設問文はホスト側の大画面に表示されています
      </p>

      <div class="choice-grid">
        <button class="choice-btn a">▲</button>
        <button class="choice-btn b">◆</button>
        <button class="choice-btn c">●</button>
        <button class="choice-btn d">■</button>
      </div>
    </div>
  </body>
</html>
