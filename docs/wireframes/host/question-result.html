<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>neo-hoot | 設問結果(ホスト)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../shared.css" />
<style>
  .layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 2rem;
    max-width: 1000px;
    margin: 0 auto;
  }
  .q-body {
    text-align: center;
    font-size: 1.5rem;
    font-family: 'Paytone One', system-ui, sans-serif;
    margin-bottom: 1.5rem;
  }
  .result-bar-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .result-bar-row .label {
    width: 100px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .result-bar-track {
    flex: 1;
    height: 2.5rem;
    border: var(--border-width) solid var(--color-ink);
    border-radius: var(--radius);
    background: var(--color-surface);
    overflow: hidden;
  }
  .result-bar-fill {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 0.75rem;
    color: #fff;
    font-weight: 600;
    font-family: 'Paytone One', system-ui, sans-serif;
  }
  .result-bar-fill.correct {
    background: var(--color-success);
  }
  .result-bar-fill.wrong {
    background: var(--color-danger);
  }
</style>
</head>
<body>

<div class="layout">
  <div>
    <p class="badge" style="margin-bottom: 1rem;">正解: 北海道</p>
    <p class="q-body">日本で一番面積が大きい都道府県は？</p>

    <div class="result-bar-row">
      <span class="label">▲ 北海道</span>
      <div class="result-bar-track">
        <div class="result-bar-fill correct" style="width: 60%;">60% (7人)</div>
      </div>
    </div>
    <div class="result-bar-row">
      <span class="label">◆ 岩手県</span>
      <div class="result-bar-track">
        <div class="result-bar-fill wrong" style="width: 25%;">25% (3人)</div>
      </div>
    </div>
    <div class="result-bar-row">
      <span class="label">● 福島県</span>
      <div class="result-bar-track">
        <div class="result-bar-fill wrong" style="width: 8%;">8% (1人)</div>
      </div>
    </div>
    <div class="result-bar-row">
      <span class="label">■ 長野県</span>
      <div class="result-bar-track">
        <div class="result-bar-fill wrong" style="width: 8%;">8% (1人)</div>
      </div>
    </div>
  </div>

  <div>
    <h2 style="margin-top: 0;">現在の順位</h2>
    <div class="row" style="flex-direction: column; align-items: stretch;">
      <div class="list-item">
        <span class="rank">1</span>
        <span class="name">はなこ</span>
        <span class="badge">1850pt</span>
      </div>
      <div class="list-item">
        <span class="rank">2</span>
        <span class="name">たろう</span>
        <span class="badge">1620pt</span>
      </div>
      <div class="list-item">
        <span class="rank">3</span>
        <span class="name">じろう</span>
        <span class="badge">1400pt</span>
      </div>
    </div>
  </div>
</div>

<div style="text-align: center; margin-top: 2.5rem;">
  <button class="btn" style="font-size: 1.25rem; padding: 1rem 3rem;">次の設問へ</button>
</div>

</body>
</html>
