<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neo-hoot | ログイン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .login-screen {
        min-height: calc(100vh - 4rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      /* OAuthボタンは各サービスの公式配色に寄せる(自社の黄色/影デザインの太枠+影は共通言語として残す) */
      .oauth-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        width: 100%;
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border: var(--border-width) solid var(--color-ink);
        border-radius: var(--radius);
        box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--color-ink);
        cursor: pointer;
      }
      .oauth-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--color-ink);
      }
      .oauth-btn.google {
        background: #ffffff;
        color: #1f1f1f;
      }
      .oauth-btn.github {
        background: #24292f;
        color: #ffffff;
      }
      .oauth-btn svg {
        width: 20px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="login-screen">
      <h1 style="font-size: 3rem">neo-hoot</h1>

      <div class="mode-switch">
        <a href="../participant/join.html">参加する</a>
        <a class="active" href="login.html">ホストの方はこちら</a>
      </div>

      <p class="lede">ホストとしてクイズを作成・開催する</p>

      <div class="card enter-animate" style="width: 100%; max-width: 360px">
        <button class="oauth-btn google" style="margin-bottom: 1rem">
          <svg viewBox="0 0 48 48">
            <path
              fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.6 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.5z"
            />
            <path
              fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
            />
            <path
              fill="#4CAF50"
              d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.3C29.6 34.9 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"
            />
            <path
              fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.3C41.5 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"
            />
          </svg>
          Googleで始める
        </button>
        <button class="oauth-btn github">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
          GitHubで始める
        </button>
      </div>

      <p
        class="lede"
        style="margin-top: 2rem; font-size: 0.8rem; max-width: 320px"
      >
        初めての方は自動でアカウントが作成されます。新規登録の手続きは不要です。
      </p>
    </div>
  </body>
</html>
