<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neo-hoot | クイズ一覧</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .quiz-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
      }
      .quiz-card h3 {
        font-family: 'Paytone One', system-ui, sans-serif;
        margin: 0 0 0.5rem;
      }
      .quiz-card .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .page-title {
        font-size: 1.5rem;
        margin: 0;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="host-screen">
      <div class="app-header">
        <a class="logo" href="dashboard.html">neo-hoot</a>
        <button class="user-menu">
          <span class="avatar">田</span>
          <span>たなか さん</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </div>

      <div class="host-header">
        <h2 class="page-title">クイズ一覧</h2>
        <button class="btn">＋ 新しいクイズを作成</button>
      </div>

      <div class="quiz-grid">
        <div class="card quiz-card">
          <h3>都道府県クイズ</h3>
          <p class="lede" style="margin: 0">全10問・4択</p>
          <div class="meta">
            <span class="badge">開催回数: 5回</span>
            <button
              class="btn btn-accent"
              style="padding: 0.5rem 1rem; font-size: 0.85rem"
            >
              開催する
            </button>
          </div>
        </div>
        <div class="card quiz-card">
          <h3>チームビルディング アンケート</h3>
          <p class="lede" style="margin: 0">全5問・アンケート</p>
          <div class="meta">
            <span class="badge">開催回数: 1回</span>
            <button
              class="btn btn-accent"
              style="padding: 0.5rem 1rem; font-size: 0.85rem"
            >
              開催する
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
