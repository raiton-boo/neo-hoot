<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>neo-hoot | 回答画面(アンケート)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../shared.css" />
<style>
  .answer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>
<body>

<div class="mobile-screen">
  <div class="answer-header">
    <span class="badge" style="background: var(--color-accent); color: #fff;">アンケート 4/5</span>
    <div class="timer">15</div>
  </div>

  <p class="lede" style="text-align: center; font-size: 0.9rem;">正解はありません。あなたの意見を選んでください</p>

  <div class="survey-list" style="margin-top: 1rem;">
    <button class="survey-btn">北海道</button>
    <button class="survey-btn">沖縄県</button>
    <button class="survey-btn">京都府</button>
    <button class="survey-btn">東京都</button>
  </div>
</div>

</body>
</html>
