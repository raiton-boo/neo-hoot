<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neo-hoot | 出題進行(ホスト)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared.css" />
    <style>
      /* 端に寄せず、タイマーを中心にした1つのまとまりとして中央に配置する */
      .q-header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 1rem;
      }

      .q-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.25rem;
        border: var(--border-width) solid var(--color-ink);
        border-radius: 999px;
        box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--color-ink);
        background: var(--color-surface);
        color: var(--color-ink);
        font-family: 'Paytone One', system-ui, sans-serif;
        font-size: 1.1rem;
        white-space: nowrap;
      }

      .q-dots {
        letter-spacing: 0.15em;
        font-size: 0.9rem;
      }

      .q-header .timer {
        width: 5rem;
        height: 5rem;
        font-size: 2.5rem;
        flex-shrink: 0;
        transition:
          background 0.3s,
          color 0.3s;
      }

      /* 残り時間が少なくなったら赤に変えて緊張感を出す */
      .q-header .timer.urgent {
        background: var(--color-danger);
        color: #fff;
      }

      .q-body {
        text-align: center;
        font-size: 2.5rem;
        font-family: 'Paytone One', system-ui, sans-serif;
        margin: 2rem 0;
      }

      .q-choice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        max-width: 700px;
        margin: 0 auto;
      }

      .q-choice {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        border: var(--border-width) solid var(--color-ink);
        border-radius: var(--radius);
        box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--color-ink);
        color: #fff;
        font-family: 'Paytone One', system-ui, sans-serif;
        font-size: 1.25rem;
        opacity: 0;
        animation: enter-fade-up 0.4s ease-out forwards;
      }
      /* 4つを時間差でポップインさせる */
      .q-choice.a {
        background: var(--color-secondary);
        animation-delay: 0.1s;
      }
      .q-choice.b {
        background: var(--color-accent);
        animation-delay: 0.25s;
      }
      .q-choice.c {
        background: #ffb800;
        animation-delay: 0.4s;
      }
      .q-choice.d {
        background: var(--color-success);
        animation-delay: 0.55s;
      }
    </style>
  </head>
  <body>
    <div class="q-header">
      <div class="q-badge">
        第2問 / 全5問
        <span class="q-dots">●●○○○</span>
      </div>

      <div class="timer" id="timer">08</div>

      <div class="q-badge">
        回答済み <span id="answered-count">8</span> / 12人
      </div>
    </div>

    <p class="q-body">日本で一番面積が大きい都道府県は？</p>

    <div class="q-choice-grid">
      <div class="q-choice a">▲ 北海道</div>
      <div class="q-choice b">◆ 岩手県</div>
      <div class="q-choice c">● 福島県</div>
      <div class="q-choice d">■ 長野県</div>
    </div>

    <script>
      // デモ用: タイマーをカウントダウンし、残り5秒以下で赤くする
      let seconds = 8;
      const timerEl = document.getElementById('timer');
      const interval = setInterval(() => {
        seconds -= 1;
        if (seconds < 0) {
          clearInterval(interval);
          return;
        }
        timerEl.textContent = String(seconds).padStart(2, '0');
        timerEl.classList.toggle('urgent', seconds <= 5);
      }, 1000);
    </script>
  </body>
</html>
