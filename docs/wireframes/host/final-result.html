<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>neo-hoot | 最終結果(ホスト)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../shared.css" />
<style>
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 1.5rem;
    max-width: 700px;
    margin: 2rem auto;
  }
  .podium-block {
    text-align: center;
  }
  .podium-name {
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .podium-bar {
    border: var(--border-width) solid var(--color-ink);
    border-radius: var(--radius) var(--radius) 0 0;
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--color-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Paytone One', system-ui, sans-serif;
    font-size: 2rem;
    color: #fff;
  }
  .podium-block.first .podium-bar { height: 200px; width: 160px; background: var(--color-primary); color: #0a0a0a; }
  .podium-block.second .podium-bar { height: 140px; width: 160px; background: var(--color-accent); }
  .podium-block.third .podium-bar { height: 100px; width: 160px; background: var(--color-secondary); }
</style>
</head>
<body>

<h1 style="text-align: center;">最終結果発表！</h1>

<div class="podium">
  <div class="podium-block second">
    <p class="podium-name">たろう</p>
    <div class="podium-bar">2</div>
  </div>
  <div class="podium-block first">
    <p class="podium-name">はなこ</p>
    <div class="podium-bar">1</div>
  </div>
  <div class="podium-block third">
    <p class="podium-name">じろう</p>
    <div class="podium-bar">3</div>
  </div>
</div>

<div style="text-align: center; margin-top: 2.5rem;">
  <button class="btn btn-accent" style="font-size: 1.1rem; padding: 1rem 2rem; margin-right: 1rem;">もう一度開催する</button>
  <button class="btn" style="font-size: 1.1rem; padding: 1rem 2rem;">クイズ一覧に戻る</button>
</div>

</body>
</html>
